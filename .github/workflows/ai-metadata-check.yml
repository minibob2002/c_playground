name: AI metadata check

on:
  push:
  pull_request:

jobs:
  ai-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate AI metadata report
        run: python tools/grade_ai_metadata.py

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: ai-metadata-grade-report
          path: .assignment/ai-metadata-grade-report.md
